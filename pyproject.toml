[project]
name = "institutional_theme"
authors = [
    { name = "Hamza ALsaqaf" }
]
description = "Midad: an upgrade-safe institutional visual identity and UI theme for the Frappe / ERPNext v16 desk (Light and Dark, Arabic-first)"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Verified against these versions. Re-run the audits before widening the range.
[tool.bench.frappe-dependencies]
frappe = ">=16.32.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"
# One-off scripts kept as evidence of a verification run, not shipped code.
extend-exclude = ["docs/team/evidence"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E101", "E402", "E501", "W191", "B017", "B018", "B023", "B904", "RUF001", "RUF012"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
