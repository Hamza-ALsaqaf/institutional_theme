name: CI

# Lint and audits only. A full Frappe bench is not built in CI: it takes too long and needs
# a database server. The bench is built by tools/bench/build_test_bench.sh on a developer
# machine or in the build container.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  audits:
    name: Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The audits are dependency-free Python and must not import Frappe. The module does not
      # exist before Phase 2; the step then reports that and passes.
      - name: Run audits (python -m institutional_theme.audits)
        run: |
          if [ -f institutional_theme/audits/__main__.py ] || [ -f institutional_theme/audits.py ]; then
            python -m institutional_theme.audits
          else
            echo "institutional_theme.audits does not exist yet; nothing to run."
          fi
