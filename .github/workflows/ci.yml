name: CI

# Lint and audits only. A full Frappe bench is not built in CI: it takes too long and needs
# a database server. The bench is built by tools/bench/build_test_bench.sh on a developer
# machine or in the build container.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff==0.16.8

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  audits:
    name: Tests and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The colour package and the audits are dependency-free Python and never import Frappe,
      # so these steps need no bench and no pip install. Tests that need a site
      # (the Settings doctype) run on the test bench: tools/bench/README.md.
      - name: Unit tests (colour package, emitter, fonts)
        run: python -m unittest discover -s institutional_theme/midad/tests -t .

      - name: Unit tests (audits)
        run: python -m unittest discover -s institutional_theme/audits/tests -t .

      - name: Generated files are current
        run: python -m institutional_theme.midad.build --check

      # The dead-token audit reads the committed snapshot of core variable names
      # (institutional_theme/audits/data), so it needs no bench.
      - name: Audits (contrast, parity, colour vision, dead tokens)
        run: python -m institutional_theme.audits
