<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}" data-theme-mode="{{MODE}}" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<title>cascade fixture</title>
{{LINKS}}
</head>
<body>
<div class="page-head"><div class="page-head-content"><button class="btn btn-default" id="btn">Action</button></div></div>
<main>
	<input class="form-control" id="field" placeholder="placeholder" aria-label="field">
	<a class="badge badge-primary" id="badge" href="#x">badge</a>
	<input type="checkbox" id="check" aria-label="check">
	<select class="custom-select" id="select" aria-label="select"><option>one</option></select>
	<div class="datatable" id="dt"><button id="dtbtn" type="button">cell</button></div>
	<div class="modal" id="modalshell" tabindex="-1"><button id="modalbtn" type="button">in modal</button></div>
	<div class="datatable" id="dt2"><input type="checkbox" id="dt-off" aria-label="dt off"><input type="checkbox" id="dt-on" checked aria-label="dt on"></div>
	<div class="form-grid"><div class="grid-body"><div class="rows"><div class="grid-row"><input type="checkbox" id="gr-off" aria-label="grid off"><input type="checkbox" id="gr-on" checked aria-label="grid on"></div></div></div></div>
	<div class="frappe-list"><div class="result"><div class="result-container"><div class="list-row-container"><input type="checkbox" class="list-row-checkbox" id="ls-off" aria-label="list off"><input type="checkbox" class="list-row-checkbox" id="ls-on" checked aria-label="list on"></div></div></div></div>
	<div class="datatable" id="dt3"><input class="form-control" id="dtfield" aria-label="dt field"></div>
	<button class="btn btn-default" id="btn2" type="button">Default</button>
	<input id="af" class="form-control" aria-label="autofill probe">
</main>
</body>
</html>
