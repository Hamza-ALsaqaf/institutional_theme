<!-- Mirrors frappe/public/js/frappe/form/layout.js, controls/*.js (frappe-control, form-group) and form/form.js (page head, indicator). -->
<div class="proof-desk" data-screen-root>
%%SHELL%%
<div class="main-section">
<div class="content page-container">
%%PAGEHEAD%%
<div class="container page-body"><div class="page-wrapper"><div class="page-content">
<div class="layout-main layout-two-column"><div class="layout-main-section-wrapper"><div class="layout-main-section">
<div class="std-form-layout"><div class="form-layout"><div class="form-page">
	<div class="form-section card-section visible-section" data-fieldname="details"><div class="section-body">
		<div class="form-column col-sm-6" data-fieldname="col1"><form>
			<div class="frappe-control input-max-width" data-fieldtype="Select" data-fieldname="status">
				<div class="form-group horizontal"><div class="clearfix"><label style="padding-right: 5px;" class="control-label">[[form.status]]</label></div>
				<div class="control-input-wrapper"><div class="control-input flex align-center"><select class="input-with-feedback form-control ellipsis" data-fieldtype="Select"><option>[[list.open]]</option></select><div class="select-icon"><svg class="icon icon-sm" aria-hidden="true"><use href="#icon-select"></use></svg></div></div></div></div>
			</div>
			<div class="frappe-control input-max-width" data-fieldtype="Data" data-fieldname="title">
				<div class="form-group horizontal"><div class="clearfix"><label style="padding-right: 5px;" class="control-label reqd">[[form.title]]</label></div>
				<div class="control-input-wrapper"><div class="control-input"><input type="text" class="input-with-feedback form-control" value="" data-fieldtype="Data"></div><div class="help-box small text-extra-muted">[[form.help]]</div></div></div>
			</div>
		</form></div>
		<div class="form-column col-sm-6" data-fieldname="col2"><form>
			<div class="frappe-control input-max-width has-error" data-fieldtype="Date" data-fieldname="date">
				<div class="form-group horizontal"><div class="clearfix"><label style="padding-right: 5px;" class="control-label reqd">[[form.due]]</label></div>
				<div class="control-input-wrapper"><div class="control-input"><input type="text" class="input-with-feedback form-control" value="" data-fieldtype="Date"></div></div></div>
			</div>
			<div class="frappe-control input-max-width" data-fieldtype="Data" data-fieldname="owner_name">
				<div class="form-group horizontal"><div class="clearfix"><label style="padding-right: 5px;" class="control-label">[[form.owner]]</label></div>
				<div class="control-input-wrapper"><div class="control-input"><input type="text" class="input-with-feedback form-control" value="" data-fieldtype="Data" disabled></div></div></div>
			</div>
		</form></div>
	</div></div>
</div></div></div>
</div></div></div></div></div></div>
</div>
</div>
</div>
